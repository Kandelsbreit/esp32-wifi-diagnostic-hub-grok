; PlatformIO Project Configuration File
; ESP32 Wi-Fi Diagnostic Hub by Grok

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv

lib_deps =
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    bblanchon/ArduinoJson @ ^7.2.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
